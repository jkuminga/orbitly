name: Orbitly Discord reminders

on:
  workflow_dispatch:
  schedule:
    # KST: 09:17, 12:17, 15:17, 18:17, 21:17, 00:17
    - cron: "17 0,3,6,9,12,15 * * *"
    # KST: 10:47, 13:47, 16:47, 19:47, 22:47, 01:47
    - cron: "47 1,4,7,10,13,16 * * *"

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Send Orbitly reminder to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ORBITLY_USER_ID: ${{ secrets.ORBITLY_USER_ID }}
        run: node scripts/send-discord-reminder.mjs
